<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard – CPA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#F5C842;--green:#22C55E;--teal:#14B8A6;--blue:#3B82F6;--purple:#A855F7;--dark:#080C1A;--navy:#0E1228;--card:#111735;--gray:#7A839A;--off:#E8EAF0;--red:#EF4444}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--dark);color:var(--off);font-family:'DM Sans',sans-serif;min-height:100vh}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.login-box{background:var(--card);border:1.5px solid rgba(245,200,66,.3);border-radius:16px;padding:2.5rem;width:100%;max-width:380px}
.login-logo{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--gold);letter-spacing:3px;text-align:center;margin-bottom:.3rem}
.login-sub{color:var(--gray);font-size:.8rem;text-align:center;margin-bottom:2rem}
.form-group{margin-bottom:1.1rem}
.form-group label{display:block;font-size:.75rem;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:1px;margin-bottom:.4rem}
.form-group input{width:100%;background:#0a0e1f;border:1.5px solid rgba(255,255,255,.1);border-radius:8px;padding:.7rem 1rem;color:var(--off);font-size:.9rem;font-family:'DM Sans',sans-serif;outline:none}
.form-group input:focus{border-color:var(--gold)}
.btn-gold{width:100%;background:var(--gold);color:#080C1A;border:none;border-radius:8px;padding:.8rem;font-size:.9rem;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.error-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red);border-radius:8px;padding:.65rem 1rem;font-size:.8rem;margin-top:.7rem;display:none}
#app{display:none}
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:56px;background:rgba(8,12,26,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(245,200,66,.15);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--gold);letter-spacing:2px}
.nav-badge{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:var(--red);font-size:.68rem;font-weight:700;padding:.2rem .6rem;border-radius:4px;letter-spacing:1px}
.btn-logout{background:transparent;border:1px solid rgba(255,255,255,.1);color:var(--gray);border-radius:6px;padding:.3rem .75rem;font-size:.73rem;cursor:pointer;font-family:'DM Sans',sans-serif}
.tabs{display:flex;gap:.3rem;padding:.7rem 1.5rem 0;background:var(--navy);border-bottom:1px solid rgba(255,255,255,.06);margin-top:56px}
.tab{padding:.55rem 1.1rem;border-radius:8px 8px 0 0;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--gray);border:none;background:transparent;font-family:'DM Sans',sans-serif;transition:all .2s}
.tab.active{background:var(--card);color:var(--gold)}
.content{padding:1.8rem 1.5rem;max-width:1200px;margin:0 auto}
.section{display:none}
.section.active{display:block}
.sec-title{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--off);margin-bottom:1.2rem}
.card-box{background:var(--card);border-radius:12px;padding:1.4rem;margin-bottom:1.2rem;border:1px solid rgba(255,255,255,.06)}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--gold);margin-bottom:1rem}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--card);border-radius:12px;padding:1.2rem;text-align:center;border:1px solid rgba(255,255,255,.06)}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--gold);line-height:1}
.stat-lbl{font-size:.72rem;color:var(--gray);margin-top:.3rem;text-transform:uppercase;letter-spacing:1px}
/* TABLE */
.data-table{width:100%;border-collapse:collapse}
.data-table th{background:rgba(245,200,66,.1);color:var(--gold);font-size:.72rem;text-transform:uppercase;letter-spacing:1px;padding:.65rem 1rem;text-align:left;border-bottom:1px solid rgba(245,200,66,.15)}
.data-table td{padding:.75rem 1rem;border-bottom:1px solid rgba(255,255,255,.04);font-size:.85rem;vertical-align:middle}
.data-table tr:hover td{background:rgba(255,255,255,.02)}
.badge{display:inline-block;padding:.2rem .5rem;border-radius:4px;font-size:.68rem;font-weight:700;color:#080C1A}
.btn-sm{padding:.3rem .75rem;border-radius:6px;font-size:.75rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;border:none}
.btn-red{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.btn-blue{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.3)}
.btn-green{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.btn-gold-sm{background:var(--gold);color:#080C1A}
/* FORM */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.form-input{width:100%;background:#0a0e1f;border:1.5px solid rgba(255,255,255,.1);border-radius:8px;padding:.65rem .9rem;color:var(--off);font-size:.88rem;font-family:'DM Sans',sans-serif;outline:none}
.form-input:focus{border-color:var(--gold)}
.empty-state{text-align:center;color:var(--gray);padding:2.5rem;font-size:.88rem}
.pill-clr{width:14px;height:14px;border-radius:3px;display:inline-block;vertical-align:middle;margin-right:6px}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">ADMIN</div>
    <div class="login-sub">Accesso riservato</div>
    <div class="form-group"><label>Email</label><input type="text" id="a-email" placeholder="email admin"></div>
    <div class="form-group"><label>Password</label><input type="password" id="a-pw" placeholder="••••••••"></div>
    <button class="btn-gold" onclick="doLogin()">ACCEDI</button>
    <div class="error-msg" id="a-err"></div>
  </div>
</div>

<div id="app">
  <nav>
    <div style="display:flex;align-items:center;gap:.8rem">
      <div class="nav-logo">ADMIN PANEL</div>
      <div class="nav-badge">PRIVATO</div>
    </div>
    <button class="btn-logout" onclick="doLogout()">Esci</button>
  </nav>

  <div class="tabs">
    <button class="tab active" onclick="showTab('overview')">📊 Overview</button>
    <button class="tab" onclick="showTab('pr')">👥 PR</button>
    <button class="tab" onclick="showTab('iscrizioni')">✍️ Iscrizioni</button>
    <button class="tab" onclick="showTab('links')">🔗 Link</button>
  </div>

  <!-- OVERVIEW -->
  <div class="content section active" id="tab-overview">
    <div class="sec-title">OVERVIEW</div>
    <div class="stats-grid" id="ov-stats"></div>
    <div class="card-box">
      <div class="card-title">CLASSIFICA PR (mese corrente)</div>
      <div id="ov-ranking"><div class="empty-state">Caricamento...</div></div>
    </div>
  </div>

  <!-- PR -->
  <div class="content section" id="tab-pr">
    <div class="sec-title">GESTIONE PR</div>
    <div class="card-box">
      <div class="card-title">CREA NUOVO PR</div>
      <div class="form-row">
        <div><label style="font-size:.75rem;color:var(--gray);display:block;margin-bottom:.4rem">NOME COMPLETO</label>
          <input class="form-input" id="pr-name" placeholder="Nome Cognome"></div>
        <div><label style="font-size:.75rem;color:var(--gray);display:block;margin-bottom:.4rem">USERNAME</label>
          <input class="form-input" id="pr-username" placeholder="es. marco_rossi"></div>
      </div>
      <div class="form-row">
        <div><label style="font-size:.75rem;color:var(--gray);display:block;margin-bottom:.4rem">EMAIL</label>
          <input class="form-input" id="pr-email" placeholder="email@esempio.com"></div>
        <div><label style="font-size:.75rem;color:var(--gray);display:block;margin-bottom:.4rem">PASSWORD TEMPORANEA</label>
          <input class="form-input" id="pr-pw" placeholder="min 8 caratteri"></div>
      </div>
      <button class="btn-gold" style="width:auto;padding:.7rem 2rem" onclick="createPR()">CREA PR</button>
      <div class="error-msg" id="pr-err"></div>
      <div id="pr-success" style="display:none;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--green);border-radius:8px;padding:.65rem 1rem;font-size:.82rem;margin-top:.7rem"></div>
    </div>

    <div class="card-box">
      <div class="card-title">LISTA PR</div>
      <div id="pr-list"><div class="empty-state">Caricamento...</div></div>
    </div>
  </div>

  <!-- ISCRIZIONI -->
  <div class="content section" id="tab-iscrizioni">
    <div class="sec-title">TUTTE LE ISCRIZIONI</div>
    <div style="display:flex;gap:.8rem;margin-bottom:1.2rem;flex-wrap:wrap">
      <select class="form-input" id="filter-pr" style="max-width:220px" onchange="loadAllIscrizioni()">
        <option value="">Tutti i PR</option>
      </select>
      <select class="form-input" id="filter-book" style="max-width:180px" onchange="loadAllIscrizioni()">
        <option value="">Tutti i book</option>
      </select>
    </div>
    <div class="card-box" style="padding:0;overflow:hidden">
      <div id="iscr-table"><div class="empty-state">Caricamento...</div></div>
    </div>
  </div>

  <!-- LINKS -->
  <div class="content section" id="tab-links">
    <div class="sec-title">LINK DI AFFILIAZIONE</div>
    <div class="card-box" style="padding:0;overflow:hidden">
      <div id="links-table"><div class="empty-state">Caricamento...</div></div>
    </div>
  </div>
</div>

<!-- EDIT LINK MODAL -->
<div id="edit-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;padding:1rem">
  <div style="background:var(--card);border:1.5px solid rgba(245,200,66,.2);border-radius:14px;padding:2rem;width:100%;max-width:460px">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--gold);margin-bottom:1.2rem" id="edit-modal-title">MODIFICA LINK</div>
    <input type="hidden" id="edit-id">
    <div style="margin-bottom:1rem"><label style="font-size:.75rem;color:var(--gray);display:block;margin-bottom:.4rem">BOOK</label>
      <input class="form-input" id="edit-book" readonly style="opacity:.6"></div>
    <div style="margin-bottom:1rem"><label style="font-size:.75rem;color:var(--gray);display:block;margin-bottom:.4rem">URL AFFILIAZIONE</label>
      <input class="form-input" id="edit-url" placeholder="https://..."></div>
    <div style="display:flex;gap:.7rem;margin-top:1.2rem">
      <button class="btn-gold" style="width:auto;padding:.7rem 2rem" onclick="saveLink()">SALVA</button>
      <button style="background:transparent;border:1px solid rgba(255,255,255,.1);color:var(--gray);border-radius:8px;padding:.7rem 1.5rem;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.85rem" onclick="closeEditModal()">Annulla</button>
    </div>
  </div>
</div>

<script>
const SUPA_URL = 'https://igagpwrdkjuburywrzcq.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnYWdwd3Jka2p1YnVyeXdyemNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDgyNzksImV4cCI6MjA5NjU4NDI3OX0.vX4c7XWvl4cBjLvlOzNuGCbFZrFoajqGaK1SATqKmIc';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

let allPRs = [], allLinks = [], allIscr = [];

async function doLogin() {
  const email = document.getElementById('a-email').value.trim();
  const pw = document.getElementById('a-pw').value;
  const err = document.getElementById('a-err');
  err.style.display='none';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
  if (error) { err.textContent='Credenziali non valide: '+error.message; err.style.display='block'; return; }
  await new Promise(r => setTimeout(r, 600));
  const { data: prof, error: profErr } = await sb.from('profiles').select('*').eq('id', data.user.id).maybeSingle();
  if (profErr) { await sb.auth.signOut(); err.textContent='Errore: '+profErr.message; err.style.display='block'; return; }
  if (!prof) { await sb.auth.signOut(); err.textContent='Profilo non trovato'; err.style.display='block'; return; }
  if (!prof.is_admin) { await sb.auth.signOut(); err.textContent='Accesso non autorizzato'; err.style.display='block'; return; }
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  await loadAll();
}

async function doLogout() { await sb.auth.signOut(); location.reload(); }

function showTab(name) {
  const tabs = ['overview','pr','iscrizioni','links'];
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', tabs[i]===name));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if (name==='iscrizioni') loadAllIscrizioni();
  if (name==='links') renderLinks();
}

async function loadAll() {
  const [prs, links, iscrs] = await Promise.all([
    sb.from('profiles').select('*').order('created_at'),
    sb.from('affiliate_links').select('*').order('book'),
    sb.from('iscrizioni').select('*').order('created_at', {ascending:false})
  ]);
  allPRs = prs.data || [];
  allLinks = links.data || [];
  allIscr = iscrs.data || [];

  renderOverview();
  renderPRList();

  // Populate filters
  const prSel = document.getElementById('filter-pr');
  allPRs.forEach(p => {
    const o = document.createElement('option'); o.value=p.id; o.textContent=p.username||p.full_name;
    prSel.appendChild(o);
  });
  const bkSel = document.getElementById('filter-book');
  allLinks.forEach(l => {
    const o = document.createElement('option'); o.value=l.book; o.textContent=l.book;
    bkSel.appendChild(o);
  });
}

function calcEuro(n) { return ({1:17,2:18,3:19,4:20})[Math.min(n,4)]||17; }

// Margine netto per singola ID
// incasso: 40 per book (SISAL, GOLDBET, LOTTOMATICA, PLANETWIN)
// deposito: 10.5 per ogni book (tutti e 4)
// commissione PR: calcEuro(nBooks) per ogni book
function calcMargine(books) {
  const INCASSO = { SISAL:40, GOLDBET:40, LOTTOMATICA:40, PLANETWIN:40 };
  const DEPOSITO = { SISAL:10.5, GOLDBET:10.5, LOTTOMATICA:10.5, PLANETWIN:10.5 };
  const n = books.length;
  const prRate = calcEuro(n);
  let incasso = 0, depositi = 0, commissioni = 0;
  books.forEach(b => {
    incasso += INCASSO[b] || 40;
    depositi += DEPOSITO[b] || 0;
    commissioni += prRate;
  });
  return { incasso, depositi, commissioni, netto: incasso - depositi - commissioni };
}

function fmtEuro(n) {
  const clr = n >= 0 ? 'var(--green)' : 'var(--red)';
  return `<span style="color:${clr};font-family:'Bebas Neue',sans-serif">€${n.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})}</span>`;
}

function renderOverview() {
  const totalPR = allPRs.filter(p=>!p.is_admin).length;
  const totalIscr = allIscr.reduce((s,i)=>s+(i.books?.length||0),0);
  const totalEuro = allIscr.reduce((s,i)=>{ const n=i.books?.length||0; return s+n*calcEuro(n); },0);

  // Calcola margini totali
  let totIncasso = 0, totDepositi = 0, totComm = 0, totNetto = 0;
  allIscr.forEach(i => {
    const m = calcMargine(i.books || []);
    totIncasso += m.incasso; totDepositi += m.depositi;
    totComm += m.commissioni; totNetto += m.netto;
  });

  document.getElementById('ov-stats').innerHTML = `
    <div class="stat-card"><div class="stat-val">${totalPR}</div><div class="stat-lbl">PR attivi</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--blue)">${allIscr.length}</div><div class="stat-lbl">Persone</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--teal)">€${totIncasso.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="stat-lbl">Incasso lordo</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--red)">€${totDepositi.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="stat-lbl">Depositi pagati</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--gold)">€${totComm.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="stat-lbl">Commissioni PR</div></div>
    <div class="stat-card" style="border-color:rgba(34,197,94,.4)"><div class="stat-val" style="color:var(--green)">€${totNetto.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="stat-lbl">Margine netto</div></div>`;

  // Ranking
  const byPR = {};
  allIscr.forEach(i => {
    const pr = allPRs.find(p=>p.id===i.pr_id);
    const name = pr?.username || pr?.full_name || 'PR sconosciuto';
    if (!byPR[name]) byPR[name] = { iscr:0, comm:0, incasso:0, depositi:0, netto:0 };
    const m = calcMargine(i.books || []);
    byPR[name].iscr += i.books?.length||0;
    byPR[name].comm += m.commissioni;
    byPR[name].incasso += m.incasso;
    byPR[name].depositi += m.depositi;
    byPR[name].netto += m.netto;
  });
  const sorted = Object.entries(byPR).sort((a,b)=>b[1].netto-a[1].netto);
  document.getElementById('ov-ranking').innerHTML = sorted.length ? `
    <table class="data-table">
      <thead><tr><th>#</th><th>PR</th><th>Iscr.</th><th>Comm. PR</th><th>Incasso</th><th>Depositi</th><th>Margine netto</th></tr></thead>
      <tbody>${sorted.map(([name,d],idx)=>`
        <tr>
          <td style="color:var(--gray);font-size:.8rem">${idx+1}</td>
          <td style="font-weight:600">${name}</td>
          <td style="color:var(--blue)">${d.iscr}</td>
          <td style="color:var(--gold);font-family:'Bebas Neue',sans-serif">€${d.comm.toFixed(2)}</td>
          <td style="color:var(--teal);font-family:'Bebas Neue',sans-serif">€${d.incasso.toFixed(2)}</td>
          <td style="color:var(--red);font-family:'Bebas Neue',sans-serif">€${d.depositi.toFixed(2)}</td>
          <td>${fmtEuro(d.netto)}</td>
        </tr>`).join('')}
      </tbody>
    </table>` : '<div class="empty-state">Nessun dato.</div>';
}

function renderPRList() {
  const prs = allPRs.filter(p=>!p.is_admin);
  document.getElementById('pr-list').innerHTML = prs.length ? `
    <table class="data-table">
      <thead><tr><th>Username</th><th>Nome</th><th>Email</th><th>Iscrizioni</th><th>Commissioni</th><th>Ciclo</th><th>Azioni</th></tr></thead>
      <tbody>${prs.map(p => {
        const pIscr = allIscr.filter(i=>i.pr_id===p.id);
        const totN = pIscr.reduce((s,i)=>s+(i.books?.length||0),0);
        const totE = pIscr.reduce((s,i)=>{ const n=i.books?.length||0; return s+n*calcEuro(n);},0);
        const fl = p.first_login_at ? new Date(p.first_login_at).toLocaleDateString('it-IT') : '—';
        return `<tr>
          <td style="font-weight:600;color:var(--gold)">${p.username||'—'}</td>
          <td>${p.full_name||'—'}</td>
          <td style="color:var(--gray);font-size:.8rem">${p.email||'—'}</td>
          <td style="color:var(--blue)">${totN}</td>
          <td style="color:var(--green);font-family:'Bebas Neue',sans-serif">€${totE.toLocaleString('it-IT')}</td>
          <td style="color:var(--gray);font-size:.78rem">${fl}</td>
          <td><button class="btn-sm btn-red" onclick="deletePR('${p.id}')">Elimina</button></td>
        </tr>`;}).join('')}
      </tbody>
    </table>` : '<div class="empty-state">Nessun PR ancora.</div>';
}

async function createPR() {
  const name = document.getElementById('pr-name').value.trim();
  const username = document.getElementById('pr-username').value.trim();
  const email = document.getElementById('pr-email').value.trim();
  const pw = document.getElementById('pr-pw').value;
  const err = document.getElementById('pr-err');
  const suc = document.getElementById('pr-success');
  err.style.display='none'; suc.style.display='none';
  if (!name||!username||!email||!pw) { err.textContent='Compila tutti i campi'; err.style.display='block'; return; }
  if (pw.length<8) { err.textContent='Password minimo 8 caratteri'; err.style.display='block'; return; }

  // Use service role would be needed for admin user creation - using signUp as workaround
  const { data, error } = await sb.auth.signUp({ email, password: pw });
  if (error) { err.textContent='Errore: '+error.message; err.style.display='block'; return; }

  if (data.user) {
    await sb.from('profiles').insert({
      id: data.user.id, username, full_name: name,
      is_admin: false, must_change_password: true
    });
    suc.textContent = `✓ PR "${username}" creato! Credenziali: ${email} / ${pw}`;
    suc.style.display='block';
    document.getElementById('pr-name').value='';
    document.getElementById('pr-username').value='';
    document.getElementById('pr-email').value='';
    document.getElementById('pr-pw').value='';
    await loadAll();
  }
}

async function deletePR(id) {
  if (!confirm('Eliminare questo PR e tutte le sue iscrizioni?')) return;
  await sb.from('iscrizioni').delete().eq('pr_id', id);
  await sb.from('profiles').delete().eq('id', id);
  await loadAll();
}

async function loadAllIscrizioni() {
  const prFilter = document.getElementById('filter-pr').value;
  const bkFilter = document.getElementById('filter-book').value;
  let data = [...allIscr];
  if (prFilter) data = data.filter(i=>i.pr_id===prFilter);
  if (bkFilter) data = data.filter(i=>i.books?.includes(bkFilter));

  document.getElementById('iscr-table').innerHTML = data.length ? `
    <table class="data-table">
      <thead><tr><th>Persona</th><th>PR</th><th>Book</th><th>Data</th><th>Incasso</th><th>Depositi</th><th>Comm. PR</th><th>Margine netto</th><th>Azioni</th></tr></thead>
      <tbody>${data.map(i => {
        const pr = allPRs.find(p=>p.id===i.pr_id);
        const n = i.books?.length||0;
        const euro = n * calcEuro(n);
        const m = calcMargine(i.books || []);
        return `<tr>
          <td style="font-weight:600">${i.nome_cognome}</td>
          <td style="color:var(--gold)">${pr?.username||'—'}</td>
          <td>${(i.books||[]).map(b=>{ const lk=allLinks.find(x=>x.book===b); return `<span class="badge" style="background:${lk?.colore||'#666'}">${b}</span>`; }).join(' ')}</td>
          <td style="color:var(--gray);font-size:.8rem">${new Date(i.data_iscrizione).toLocaleDateString('it-IT')}</td>
          <td style="color:var(--teal);font-family:'Bebas Neue',sans-serif" title="Incasso lordo">€${m.incasso.toFixed(2)}</td>
          <td style="color:var(--red);font-family:'Bebas Neue',sans-serif" title="Depositi">-€${m.depositi.toFixed(2)}</td>
          <td style="color:var(--gold);font-family:'Bebas Neue',sans-serif" title="Commissione PR">-€${m.commissioni.toFixed(2)}</td>
          <td>${fmtEuro(m.netto)}</td>
          <td><button class="btn-sm btn-red" onclick="deleteIscr('${i.id}')">Elimina</button></td>
        </tr>`;}).join('')}
      </tbody>
    </table>` : '<div class="empty-state" style="padding:2rem">Nessuna iscrizione trovata.</div>';
}

async function deleteIscr(id) {
  if (!confirm('Eliminare questa iscrizione?')) return;
  await sb.from('iscrizioni').delete().eq('id', id);
  allIscr = allIscr.filter(i=>i.id!==id);
  loadAllIscrizioni();
  renderOverview();
}

function renderLinks() {
  document.getElementById('links-table').innerHTML = allLinks.length ? `
    <table class="data-table">
      <thead><tr><th>Book</th><th>URL Affiliazione</th><th>Azioni</th></tr></thead>
      <tbody>${allLinks.map(l=>`
        <tr>
          <td><span class="pill-clr" style="background:${l.colore}"></span><strong>${l.book}</strong></td>
          <td style="color:var(--gray);font-size:.8rem;max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l.url}</td>
          <td><button class="btn-sm btn-blue" onclick="openEditModal('${l.id}','${l.book}','${l.url}')">Modifica</button></td>
        </tr>`).join('')}
      </tbody>
    </table>` : '<div class="empty-state">Nessun link.</div>';
}

function openEditModal(id, book, url) {
  document.getElementById('edit-id').value=id;
  document.getElementById('edit-book').value=book;
  document.getElementById('edit-url').value=url;
  document.getElementById('edit-modal').style.display='flex';
}
function closeEditModal() { document.getElementById('edit-modal').style.display='none'; }

async function saveLink() {
  const id = document.getElementById('edit-id').value;
  const url = document.getElementById('edit-url').value.trim();
  if (!url) return;
  await sb.from('affiliate_links').update({ url }).eq('id', id);
  closeEditModal();
  const { data } = await sb.from('affiliate_links').select('*').order('book');
  allLinks = data || [];
  renderLinks();
}

sb.auth.getSession().then(async ({ data }) => {
  if (data.session) {
    const { data: prof } = await sb.from('profiles').select('*').eq('id', data.session.user.id).single();
    if (prof?.is_admin) {
      document.getElementById('login-screen').style.display='none';
      document.getElementById('app').style.display='block';
      await loadAll();
    }
  }
});
</script>
</body>
</html>
