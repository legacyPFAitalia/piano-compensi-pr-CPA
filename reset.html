<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#F5C842;--green:#22C55E;--dark:#080C1A;--card:#111735;--gray:#7A839A;--off:#E8EAF0;--red:#EF4444}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--dark);color:var(--off);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.box{background:var(--card);border:1.5px solid rgba(245,200,66,.3);border-radius:16px;padding:2.5rem;width:100%;max-width:400px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--gold);letter-spacing:3px;text-align:center;margin-bottom:.3rem}
.sub{color:var(--gray);font-size:.82rem;text-align:center;margin-bottom:2rem}
.form-group{margin-bottom:1.1rem}
.form-group label{display:block;font-size:.75rem;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:1px;margin-bottom:.4rem}
.form-group input{width:100%;background:#0a0e1f;border:1.5px solid rgba(255,255,255,.1);border-radius:8px;padding:.75rem 1rem;color:var(--off);font-size:.95rem;font-family:'DM Sans',sans-serif;outline:none}
.form-group input:focus{border-color:var(--gold)}
.btn{width:100%;background:var(--gold);color:#080C1A;border:none;border-radius:8px;padding:.85rem;font-size:.95rem;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.msg{border-radius:8px;padding:.7rem 1rem;font-size:.83rem;margin-top:.8rem;display:none}
.msg.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red)}
.msg.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--green)}
.waiting{text-align:center;color:var(--gray);font-size:.85rem}
</style>
</head>
<body>
<div class="box">
  <div class="logo">RESET PASSWORD</div>
  <div class="sub" id="sub">Verifica del link in corso...</div>
  <div id="waiting" class="waiting">⏳ Attendere...</div>
  <div id="form" style="display:none">
    <div class="form-group">
      <label>Nuova Password</label>
      <input type="password" id="new-pw" placeholder="minimo 8 caratteri">
    </div>
    <div class="form-group">
      <label>Conferma Password</label>
      <input type="password" id="new-pw2" placeholder="ripeti la password">
    </div>
    <button class="btn" onclick="savePw()">SALVA NUOVA PASSWORD</button>
    <div class="msg err" id="err"></div>
    <div class="msg ok" id="ok"></div>
  </div>
</div>

<script>
const SUPA_URL = 'https://igagpwrdkjuburywrzcq.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnYWdwd3Jka2p1YnVyeXdyemNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDgyNzksImV4cCI6MjA5NjU4NDI3OX0.vX4c7XWvl4cBjLvlOzNuGCbFZrFoajqGaK1SATqKmIc';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

// Supabase invia il token nell'URL come hash (#access_token=...&type=recovery)
// oppure come query param (?code=...) a seconda della versione
async function init() {
  // Caso 1: hash con access_token (vecchio flusso)
  const hash = window.location.hash;
  if (hash && hash.includes('access_token')) {
    const params = new URLSearchParams(hash.substring(1));
    const access_token = params.get('access_token');
    const refresh_token = params.get('refresh_token');
    if (access_token) {
      const { error } = await sb.auth.setSession({ access_token, refresh_token });
      if (!error) { showForm(); return; }
    }
  }

  // Caso 2: query param ?code= (nuovo flusso PKCE)
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('code');
  if (code) {
    const { error } = await sb.auth.exchangeCodeForSession(code);
    if (!error) { showForm(); return; }
  }

  // Caso 3: sessione già presente
  const { data } = await sb.auth.getSession();
  if (data.session) { showForm(); return; }

  document.getElementById('sub').textContent = 'Link non valido o scaduto';
  document.getElementById('waiting').textContent = '❌ Richiedi un nuovo link da Supabase → Authentication → Users → Send password recovery';
}

function showForm() {
  document.getElementById('sub').textContent = 'Imposta la tua nuova password';
  document.getElementById('waiting').style.display = 'none';
  document.getElementById('form').style.display = 'block';
}

async function savePw() {
  const pw1 = document.getElementById('new-pw').value;
  const pw2 = document.getElementById('new-pw2').value;
  const err = document.getElementById('err');
  const ok = document.getElementById('ok');
  err.style.display='none'; ok.style.display='none';
  if (pw1.length < 8) { err.textContent='Minimo 8 caratteri'; err.style.display='block'; return; }
  if (pw1 !== pw2) { err.textContent='Le password non coincidono'; err.style.display='block'; return; }
  const { error } = await sb.auth.updateUser({ password: pw1 });
  if (error) { err.textContent='Errore: '+error.message; err.style.display='block'; return; }
  ok.textContent='✓ Password aggiornata! Ora puoi accedere su admin.html con la nuova password.';
  ok.style.display='block';
  document.querySelector('.btn').style.display='none';
}

init();
</script>
</body>
</html>
